<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        html {
            height: 100%;
            box-sizing: border-box;
        }

        body {
            padding: 30px;

        }

        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }

        .wrapper {
            background-color: gold;
            border: 3px dashed black;
            padding: 20px;
        }

        div {
            border: 3px solid #333;
            background-color: #dfdfdf;
            font-size: 20px;
        }



        .wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 2%;
        }

        .a1,
        .a2,
        .a3,
        .a4 {
            width: 23%;
        }

        .b1,
        .b2 {
            width: 48%;
            margin-top: 10px;
        }

        .c1 {
            width: 98%;
            margin-top: 10px;
        }


        @media (max-width: 450px) {
            .wrapper {
                width: 90%;
                display: flex;
                flex-direction: column;

                .a1,
                .a2,
                .a3,
                .a4 {
                    width: 98%;
                }

                .b1,
                .b2 {
                    width: 98%;
                }

                .c1 {
                    width: 98%;
                }
            }
        }
    </style>

</head>

<body>

    <div class="wrapper">

        <div class="a1">A1</div>
        <div class="a2">A2</div>
        <div class="a3">A3</div>
        <div class="a4">A4</div>

        <div class="b1">B1</div>
        <div class="b2">B2</div>

        <div class="c1">C1</div>

    </div>


</body>

</html>
