<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sun and Earth Animation</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at center, #050d1a 0%, #020910 55%, #000 100%);
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .solar-system {
            position: relative;
            width: 700px;
            height: 700px;
        }

        .sun {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at 30% 30%, #fff4a3 0%, #ffd200 25%, #ff9f1c 60%, #ff6a00 100%);
            box-shadow: 0 0 30px #ffd000, 0 0 65px #ff9300, 0 0 110px rgba(255, 153, 0, 0.7);
            z-index: 10;
        }

        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: rotateOrbit linear infinite;
        }

        .orbit-earth {
            width: 360px;
            height: 360px;
            animation-duration: 12s;
        }

        .orbit-mars {
            width: 500px;
            height: 500px;
            animation-duration: 18s;
            animation-direction: reverse;
        }

        .planet {
            position: absolute;
            right: -14px;
            top: 50%;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            transform: translateY(-50%);
            box-shadow: inset -4px -4px rgba(0, 0, 0, 0.2);
        }

        .planet.earth {
            background: radial-gradient(circle at 35% 35%, #a7f1ff 0%, #45b4ff 35%, #0d4bd6 100%);
        }

        .planet.mars {
            width: 24px;
            height: 24px;
            right: -12px;
            background: radial-gradient(circle at 35% 35%, #ffc29a 0%, #df6d3b 40%, #8d3410 100%);
        }

        .moon {
            position: absolute;
            top: 50%;
            right: -8px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e7efff;
            transform: translateY(-50%);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        @keyframes rotateOrbit {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="solar-system">
        <div class="sun"></div>

        <div class="orbit orbit-earth">
            <div class="planet earth">
                <div class="moon"></div>
            </div>
        </div>

        <div class="orbit orbit-mars">
            <div class="planet mars"></div>
        </div>
    </div>
</body>
</html>
