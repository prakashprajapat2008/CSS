<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lago di Braies</title>

    <link rel="stylesheet" href="style.css">




    <style>
            .card {
                margin: 500;
                padding: 500;
                box-sizing: border-box;
                border: solid;
            }

            body {
                  font-family: Arial, sans-serif;
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  min-height: 100vh;
            }


            .card {
                    width: 350px;
                    background-color: rgb(239, 232, 232);
                    border-radius: 20px;
                    padding: 18px;
                    border: solid rgb(223, 223, 165) 5px;
            }

    
            .card img {
                    width: 100%;
                    height: 250px;
                    object-fit: cover;
                    border-radius: 15px;
                    border: solid;
            }

            .tags {
                   margin-top: 20px;
                   display: flex;
                   gap: 10px;
            }

            .tag {
                   border: 1px solid #a19ff3;
                   border-radius: 20px;
                   padding: 8px 18px;
                   color: #946ceb;
                   font-size: 16px;
            }

        
            .card p {
                    font-size: 17px;
                    line-height: 1.6;
            }
            
            .card button {
                    display: block;
                    margin: 30px auto 5px;
                    padding: 15px 40px;
                    border: none;
                    border-radius: 30px;
                    background-color: #c3d2e6;
                    color: #1261a0;
                    font-size: 16px;
                    font-weight: bold;
                    cursor: pointer;
            }

        


    
    </style>

    
</head>
<body>
    
    <div class="card">

        <img src="download.webp" alt="Lago di Braies">

        <div class="tags">
            <span class="tag">Nature</span>
            <span class="tag">Lake</span>
        </div>

</body>
</html>
