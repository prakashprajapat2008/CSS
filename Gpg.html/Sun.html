
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System</title>

    <style>
        * {
            box-sizing: border-box;
            /* height: 100vh; */
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;
            background-image: url(https://media.craiyon.com/2025-07-22/fcE1XiLjQZmRYFnsw6sFDA.webp);
            
        }

        .solar {
            position: relative;
            width: min(200vmin, 600px);
        }

        .sun {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, #fff6a0, orange, #ff4500);
            box-shadow: 0 0 25px orange, 0 0 60px #ff6a00;
        }

    
        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            /* border: 2px solid wheat; */
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: rotate linear infinite;
        }

        
        .planet {
            position: absolute;
            top: 50%;
            left: 100%;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

    
        .orbit1 {
            width: 20%;
            aspect-ratio: 1;
            animation-duration: 5s;
        }

        .orbit2 {
            width: 35%;
            aspect-ratio: 1;
            animation-duration: 7s;
        }

        .orbit3 {
            width: 50%;
            aspect-ratio: 1;
            animation-duration: 9s;
        }

        .orbit4 {
            width: 65%;
            aspect-ratio: 1;
            animation-duration: 11s;
        }

        .orbit5 {
            width: 80%;
            aspect-ratio: 1;
            animation-duration: 13s;
        }

        
        @keyframes rotate {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .orbit {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <main class="solar">

        <div class="sun" aria-label="Sun"></div>

        
        <div class="orbit orbit1">
            <img class="planet" src="https://images-assets.nasa.gov/image/PIA15162/PIA15162~orig.jpg">
        </div>

     
        <div class="orbit orbit2">
            <img class="planet" src="https://images-assets.nasa.gov/image/PIA00271/PIA00271~orig.jpg">
        </div>

      
        <div class="orbit orbit3">
            <img class="planet" src="https://images-assets.nasa.gov/image/PIA18033/PIA18033~orig.jpg">
        </div>

      
        <div class="orbit orbit4">
            <img class="planet" src="https://images-assets.nasa.gov/image/PIA00407/PIA00407~orig.jpg">
        </div>

        <div class="orbit orbit5">
           <img class="planet" src="https://images-assets.nasa.gov/image/PIA15162/PIA15162~orig.jpg">
        </div>

    </main>

</body>
</html>
