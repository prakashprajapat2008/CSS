<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at center, #0d1b2a 0%, #020812 55%, #000 100%);
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .solar-system {
            position: relative;
            width: 700px;
            height: 700px;
        }

        .sun {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 120px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff8b0 0%, #ffd000 20%, #ff9d00 55%, #ff5f00 100%);
            box-shadow: 0 0 30px #ffbf00, 0 0 60px #ff8c00, 0 0 120px rgba(255, 153, 0, 0.5);
            z-index: 10;
        }

        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            border: 2px solid rgba(255, 255, 255, 0.18);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: rotateOrbit linear infinite;
        }

        .orbit-earth {
            width: 350px;
            height: 350px;
            animation-duration: 12s;
        }

        .orbit-mars {
            width: 470px;
            height: 470px;
            animation-duration: 16s;
            animation-direction: reverse;
        }

        .planet {
            position: absolute;
            right: -14px;
            top: 50%;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            transform: translateY(-50%);
            box-shadow: inset -4px -3px rgba(0, 0, 0, 0.2), 0 0 15px rgba(255,255,255,0.2);
        }

        .planet.earth {
            background: radial-gradient(circle at 30% 30%, #9be7ff 0%, #40a9ff 35%, #0057d9 100%);
        }

        .planet.mars {
            width: 24px;
            height: 24px;
            right: -12px;
            background: radial-gradient(circle at 30% 30%, #ffb38a 0%, #d9652b 40%, #8d3514 100%);
        }

        .moon {
            position: absolute;
            top: 50%;
            right: -8px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #dfe8ff;
            transform: translateY(-50%);
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
        }

        @keyframes rotateOrbit {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="solar-system">
        <div class="sun"></div>

        <div class="orbit orbit-earth">
            <div class="planet earth">
                <div class="moon"></div>
            </div>
        </div>

        <div class="orbit orbit-mars">
            <div class="planet mars"></div>
        </div>
    </div>
</body>
</html>
