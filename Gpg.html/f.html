<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .filter {
            filter: blur(2px);
        }

        .f {
            filter: brightness(250%);
        }

        .ff {
            filter: contrast(300%);
        }

        .fff {
            filter: drop-shadow(10px 10px  rgba(0, 0, 0, 0.908));
        }

        .ffff {
            filter: grayscale(100deg);
        }

        .fffff{
            filter: hue-rotate(100%);
        }

        .ffffff{
            filter: invert(100%);
        }

        .fffffff{
            filter: opacity(40%);
        }

        .ffffffff{
            filter: saturate(5000%);
        }

        .fffffffff{
            filter: sepia(100%);
        }

    </style>

</head>
<body>

    <img class="filter" src="images (1).jpg" alt="" width="200px" height="200px">

    <img class="f" src="profesional photo.png" alt="" width="200px" height="200px">

    <img class="ff" src="profesional photo.png" alt="" width="200px" height="200px">

    <img class="fff" src="profesional photo.png" alt="" width="200px" height="200px">

    <img class="ffff" src="profesional photo.png" alt="" width="200px" height="200px">

    <img class="fffff" src="profesional photo.png" alt="" width="200px" height="200px">

    <img class="ffffff" src="profesional photo.png" alt="" width="200px" height="200px">

    <img class="fffffff" src="profesional photo.png" alt="" width="200px" height="200px">

    <img class="ffffffff" src="profesional photo.png" alt="" width="200px" height="200px">

    <img class="fffffffff" src="profesional photo.png" alt="" width="200px" height="200px">



</body>
</html>
