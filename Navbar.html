<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     
    <style>
       

        .main{
            width: 1400px;
            height: auto;
            background-color: rgb(16, 236, 24);
            border: 3px solid black;
        }

        .navbar{
            display: flex;
            gap: 200px;
            justify-content: space-between;
            margin: 20px;
        }

        .list {
            display: flex;
            gap: 40px;
        }

        .list li{
            list-style-type: none;
            color: rgb(14, 15, 16);
        }

        .btn{
            width: 80px;
            height: 40px;
            border-radius: 20px;
            background-color: white;
            border: 2px solid;
        }

        .button{
            display: flex;
            gap: 30px;
            align-items: center;

        }

        .drop{
            background-color: antiquewhite;
            position: absolute;
            display: none;
            
        }

        .drp:hover >.drop{
            display: block;
        }

        .navbar img{
            border-radius: 60px;
        }


    </style>
   
   
   
   
</head>
<body>
      
   
   <div class="main">
    <nav class="navbar">
        <img src="cfe89b81d77a4eed574eee4bd7aa677d.jpg" width="60px" height="60">
        <ul class="list">
            <li class="drp">Home  
                <ul class="drop">
                    <li>Home</li>
                    <li>centers</li>
                    <li>contact</li>
                    <li>service</li>
                </ul></li>
            <li>About</li>
            <li>Service</li>
            <li>Contact</li>
        </ul>
        <div class="button">
        <button class="btn">Login</button>
        <button class="btn">Signup</button>
        </div>
    </nav>
   </div>


</body>
</html>
